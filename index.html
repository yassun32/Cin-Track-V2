<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CinéTrack</title>
        <link rel="icon" href="img/cinema.png">
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
            integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
            crossorigin="anonymous" referrerpolicy="no-referrer">
        <script type="module" src="JS folder/main.js" defer></script>
    </head>

    <body class="bg-gray-950 text-white">
        <header class="flex bg-gray-900 p-6">
            <div class="bg-red-600  p-2 rounded-full material-icons"></div>
            <h1 class="w-60 text-3xl hover:bg-red-600 font-bold ">CinéTrack</h1>
            <input type="text" id="search" placeholder="Rechercher un film..."
                class="w-full p-3 rounded-lg bg-gray-800 outline-none focus:ring-2 focus:ring-red-500">
            <select name="filtre" id="filtre" class="bg-gray-950">
                <option value="tous" class="bg-gray-950">tous</option>
                <option value="series" class="bg-gray-950">series</option>
                <option value="movie" class="bg-gray-950">movie</option>
            </select>
        </header>

        <main class="flex flex-col md:flex-row gap-5 p-5">
            <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 flex-1"></section>
            </section>
            <aside class="w-64 bg-gray-800 text-white p-4 rounded-xl">
                <h2 class="text-xl font-bold mb-4">Mes Favorites</h2>
                <div id="favorites">
                </div>
            </aside>

        </main>
