<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CinéTrack</title>
    <link rel="icon" href="img/cinema.png">
    <script src="https://cdn.tailwindcss.com"></script>        
    <script type="module" src="JS folder/admin.js" defer></script>
    

</head>

<body class="bg-gray-900 text-white">

    <header class="bg-gray-800 p-4">
        <nav class="flex justify-between items-center max-w-6xl mx-auto">
            <h1 class="text-2xl font-bold bg-red-600 boreder rounded-lg p-3">CinéTrack</h1>

            <a href="index.html" class="text-gray-300 hover:text-red-400 ">
                Accueil
            </a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto p-6">

        <h2 class="hover:text-red-700 underline text-3xl font-bold mb-6">Administration</h2>

        <p id="message" class="text-gray-400 mb-4">
        </p>

        <!-- Table -->
        <div class="overflow-x-auto bg-gray-800 rounded-lg">

            <table class="w-full text-left">

                <thead class="bg-gray-700">
                    <tr>
                        <th class="p-3">Image / Titre</th>
                        <th class="p-3">Type</th>
                        <th class="p-3">Année</th>
                        <th id="plus" class="p-3 hover:text-red-400">&#10133;</th>
                    </tr>
                </thead>

                <tbody id="tableBody">
                </tbody>

            </table>
        </div>

    </main>

</body>
</html>
